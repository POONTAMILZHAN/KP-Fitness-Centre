<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SKP Fitness">
  <link rel="manifest" href="manifest.json">
  <title>Dashboard — Sri KP Fitness Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app-loader"><div class="spinner spinner-lg"></div><div style="color: var(--gold); letter-spacing: 3px; font-size: 12px;">LOADING SRI KP FITNESS</div></div>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="mark">SKP</div>
        <div class="text">
          <div class="title">Sri KP Fitness</div>
          <div class="sub">MANAGEMENT SYSTEM</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="admin-card">
          <div class="avatar sm" id="admin-avatar">A</div>
          <div class="who">
            <div class="name" id="admin-name">Admin</div>
            <div class="role" id="admin-role">Owner</div>
          </div>
          <button class="logout" id="logout-btn" title="Log out">⎋</button>
        </div>
      </div>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">☰</button>
        <div class="page-title">
          <div class="path">Home / Dashboard</div>
          <h1>Dashboard</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="header-chip" id="date-chip"><span class="dot"></span><strong id="current-date">—</strong></div>
        <button class="icon-btn" id="notification-btn" title="Notifications">
          🔔<span class="pill hidden" id="notification-count">0</span>
        </button>
        <div class="profile-chip" id="profile-chip">
          <div class="avatar sm" id="header-avatar">A</div>
          <div class="name-label">
            <div class="n" id="header-name">Admin</div>
            <div class="r">Owner</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="main" id="main-outlet"></main>
  </div>

  <div id="toast-stack"></div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/gdrive.js"></script>
  <script src="js/router.js"></script>

  <!-- Page modules -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/members.js"></script>
  <script src="js/pages/plans.js"></script>
  <script src="js/pages/fees.js"></script>
  <script src="js/pages/dues.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/attendance.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/backup-page.js"></script>
  <script src="js/pages/settings.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
